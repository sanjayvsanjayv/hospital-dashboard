services:
  - type: web
    name: hospital-dashboard-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --config gunicorn.conf.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: USE_LOCAL_FALLBACK
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
